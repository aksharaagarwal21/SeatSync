spring:
  application:
    name: seatsync
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seatsync}
    username: ${DATABASE_USERNAME:seatsync}
    password: ${DATABASE_PASSWORD:seatsync}
    hikari:
      pool-name: seatsync-db
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      connection-timeout: 10000
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_updates: true
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

seatsync:
  time-zone: Asia/Kolkata
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:24h}
    cookie-name: seatsync_token
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  booking:
    locking-strategy: ${BOOKING_LOCKING_STRATEGY:OPTIMISTIC}
    hold-duration: ${BOOKING_HOLD_DURATION:5m}
    cancellation-cutoff: 24h
    hold-sweep-interval: 30s
  otp:
    enabled: ${OTP_ENABLED:true}
    code-ttl: 5m
    max-attempts: 5
    resend-cooldown: 30s
    max-sends: 5
    max-challenges: 10
    challenge-window: 15m
    from: ${MAIL_FROM:SeatSync <no-reply@seatsync.dev>}
    test-inbox-url: ${OTP_TEST_INBOX_URL:}
